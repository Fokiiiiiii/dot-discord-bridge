name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Format, Clippy, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check version consistency
        run: |
          CARGO_VER=$(grep '^version = ' Cargo.toml | head -n1 | cut -d'"' -f2)
          PLUGIN_VER=$(grep '"version":' plugin-template/plugin.json | head -n1 | cut -d'"' -f4)
          COMPOSE_VER=$(grep 'image: ghcr.io/' deploy/compose.yaml | head -n1 | cut -d':' -f3)
          echo "Cargo: $CARGO_VER, Plugin: $PLUGIN_VER, Compose: $COMPOSE_VER"
          test "$CARGO_VER" = "$PLUGIN_VER"
          test "$CARGO_VER" = "$COMPOSE_VER"

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run test suite
        run: cargo test --locked

      - name: Run release build & benchmark check
        run: |
          cargo build --release --locked
          cargo test --release --locked -- --nocapture benchmark_core_paths
