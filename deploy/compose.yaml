services:
  discord-dm:
    image: ghcr.io/fokiiiiiii/dot-discord-bridge:0.5.0
    build:
      context: ..
      dockerfile: Dockerfile
    # Host networking preserves loopback-only binding on 127.0.0.1:8787
    network_mode: host
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/discord-dm.sqlite3
      PORT: "8787"
    volumes:
      - dm-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  dm-data:
